name: 01 Exchange
description: '01 Exchange (01.xyz) was a full-suite decentralized derivatives exchange on Solana,
  offering cross-margined and cross-collateralized Perpetual Futures and Power Perpetuals (SQUOL)
  built on a fully on-chain Serum limit orderbook, with support for up to 100 markets and 50
  collateral tokens and up to 20x leverage. It was surfaced as a portfolio company of multicoin-capital
  and added to the API Evangelist network for enrichment. The people and product behind 01 are now
  part of N1 (app.n1.xyz), where trading, points, and rewards have migrated. This profile captures 01
  Exchange''s historical developer surface: the TypeScript, Python, and Rust SDKs and on-chain program
  interface published by the Zero One Global Foundation (github.com/01protocol).'
